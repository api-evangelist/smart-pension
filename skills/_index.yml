cross_cutting_rules:
- >-
  An employer is a `company`, a scheme member is an `employee`, the employer's admin is a
  `customer`. The API reflects the database, not the pensions domain.
- >-
  There is NO idempotency key. A retried write can duplicate a pension contribution. Always read
  back before retrying, and dedupe on the payroll `external_id` you control.
- >-
  There are NO webhooks and no event stream. Change detection is by polling and by re-reading
  member state before each pay run.
- >-
  Errors are a custom code/title/detail/source envelope, NOT RFC 9457, and arrive either as an
  object or as an array under `errors`. 500s return HTML, not JSON.
- >-
  Client-credentials tokens expire after 10 minutes; scopes must be enabled on the application by
  Smart before they work.
