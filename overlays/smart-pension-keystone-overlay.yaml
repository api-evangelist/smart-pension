extends: openapi/smart-pension-keystone-openapi.yml
x-generated: '2026-08-05'
x-method: generated
x-rationale: 'The published Keystone OpenAPI declares 383 operations and NONE of them carries an operationId, and its 150 tags are used on operations
  but never declared in a top-level tags[] block. Both are machine-consumption blockers: without operationIds no SDK generator, Arazzo workflow,
  agent skill or MCP tool can address an operation by name, and undeclared tags leave every generated client with undocumented groupings. This
  overlay adds an operationId to every operation, derived deterministically from the operation summary the provider already publishes (e.g. summary
  "Employees/PresignedPost/Create" -> employeesPresignedPostCreate), plus a tags[] declaration. It adds NO semantics that were not already in
  the document and it does not modify the harvested original.'
