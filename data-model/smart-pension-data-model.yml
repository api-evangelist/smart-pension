note: 'Derived mechanically from the Keystone OpenAPI: component schemas with properties, their $ref links, and
  *_id / *_ids reference fields. Path nesting is captured separately because Keystone expresses ownership primarily
  through the URL hierarchy (an employee is always addressed under its company) rather than through schema references.'
core_entities:
- Company (the employer)
- Customer (the admin of an employer)
- Employee (the scheme member)
- Adviser (accountant/IFA/payroll bureau, one-to-many over companies)
- Contribution
- Scheme
- Fund and FundSplit
- Valuation
- Postponement
- Enrolment / OptInRequest / OptOutRequest
naming_note: 'The API reflects the underlying database schema: an EMPLOYER is modelled as a `company`, the individual
  administering that employer is a `customer`, and a scheme MEMBER is an `employee`. This is stated explicitly in
  the Introduction and is the single most common source of confusion when reading the spec.'
