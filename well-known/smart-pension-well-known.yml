note: 'Exactly ONE well-known document is served across every Smart host: an RFC 7517 JSON Web Key Set at /.well-known/jwks
  on the two API hosts, carrying the RSA public key that signs Keystone''s JWT access tokens. It is declared in
  the OpenAPI as the Jwks/Get operation and is deliberately anonymous — a control path on the same origin (/.well-known/ae-control-xyz)
  returns 401, so the 200 is a real exemption from the origin-wide token auth rather than an open directory.

  Nothing else is published. Every other probed path returned one of three things: a hard 404 on the marketing and
  docs hosts; a 401 with ''WWW-Authenticate: Token realm="Application"'' on the API hosts, which authenticate the
  whole origin; or a SOFT 404 on www.autoenrolment.co.uk and my.autoenrolment.co.uk, where the single-page app answers
  HTTP 200 with its HTML shell for every path. Those soft 404s were disproven with a control path returning an identical
  200 and identical byte count, so none of them is evidence of a document. No security.txt, no OIDC discovery, no
  RFC 8414 authorization-server metadata, no api-catalog, no ai-plugin.json, and no agent card.

  Note the gap this leaves: the JWKS is published but the OIDC/OAuth metadata that would point a client AT it is
  not, so a relying party has to be told the JWKS URL out of band.'
