aid: smart-pension
name: Smart Pension
description: >-
  Smart Pension is a UK defined contribution workplace pension master trust operated by Smart Pension Limited
  (Smart Group), managing pensions for millions of UK savers on behalf of over 90,000 employers. Its API surface
  is the Keystone API — the same public REST API that powers Smart's own employer, employee and adviser portals —
  published by Keystone, Smart's proprietary savings administration platform, which also runs retirement solutions
  for financial institutions and governments outside the UK. The API lets payroll software, HR and employee-benefits
  platforms, advisers and banking apps create and manage companies (employers), employees (members), contributions,
  assessment and auto-enrolment data, postponements, opt-ins and opt-outs, valuations, funds and bank details, either
  as a full integration that provisions schemes end to end or as a light integration that posts PAPDIS contribution
  files. Authentication is OAuth 2.0 (authorization code for user-context apps, client credentials for
  machine-to-machine partners), with three sandboxed environments and self-serve partner registration.
