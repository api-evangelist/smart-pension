apis:
- name: Keystone API
  description: >-
    The public REST API behind the Keystone platform and the Smart Pension UK master trust. It exposes the same
    operations Smart's own employer, employee and adviser portals consume — companies, employees, contributions,
    enrolment and assessment, postponements, opt-ins/opt-outs, valuations, funds and fund splits, bank details,
    benefit groups, advisers, imports (PAPDIS) and batch requests. Resource-oriented URLs, JSON responses,
    offset/limit pagination with a links envelope, include[]/fields[]/filter[] query shaping, a 50-operation batch
    endpoint, integer API versioning (current v12) selectable by query parameter or Accept header, and OAuth 2.0
    authorization-code and client-credentials grants.
  humanURL: https://developers.autoenrolment.co.uk/smart
  baseURL: https://api.autoenrolment.co.uk
