release_cycle:
  documented: true
  stages:
  - name: Announcement
    description: >-
      Planned features involving endpoints are announced and pushed to newsletter subscribers, with
      the endpoints affected and the planned release date.
  - name: Beta release
    description: First release into the Development environment, testable alongside the Keystone team.
  - name: Integration release
    description: Deployed to Sandbox so developers can adapt their applications.
  - name: Final release
    description: Public release to Production, typically one week after the integration release.
  bug_fix_policy: >-
    Issues are assigned a priority based on impact and fixed accordingly; consumers report bugs via
    the Support section with a summary, the endpoints involved, and the request/response including
    headers.

