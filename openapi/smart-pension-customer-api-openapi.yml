      summary: Customers/Create
      tags:
      - Customer
      security:
      - oAuth2:
        - user
        - customer
      parameters:
      - name: company_id
        in: path
        required: true
        example: 207
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              valid_request:
                value:
                  forename: Elsa
                  surname: Frozen
                  postcode: CH1 LLY
                  email: snow@gmail.com
                  date_of_birth: '1995-01-01'
              invalid_parameter_request:
                value:
                  forename: ''
                  surname: ''
                  postcode: ''
              forbidden_request:
                value:
                  forename: Elsa
                  surname: Frozen
                  postcode: CH1 LLY
                  email: snow@gmail.com
                  date_of_birth: '1995-01-01'
            schema:
              type: object
              properties:
                date_of_birth:
                  type: string
                title:
                  type: string
                  enum:
                  - Mr
                  - Mrs
                  - Ms
                  - Miss
                  - Mx
                  - Dr
                  - Lord
                  - Lady
                  - Sir
                  - Prof
                  - Rev
                  - Captain
                  - Bursar
                forename:
                  type: string
                  maximum: 100
                  x-ruby-regexp: (?-mix:\A[[:alpha:]\s‘’`'-]*\z)
                middlename:
                  type: string
                  minimum: 2
                  maximum: 50
                surname:
                  type: string
                  x-ruby-regexp: (?-mix:\A[[:alpha:]\s‘’`'-]*\z)
                  minimum: 2
                  maximum: 80
                telephone:
                  type: string
                alternative_telephone:
                  type: string
                line1:
                  type: string
                  maximum: 140
                line2:
                  type: string
                  minimum: 2
                  maximum: 180
                city:
                  type: string
                  minimum: 2
                  maximum: 65
                county:
                  type: string
                  minimum: 2
                  maximum: 75
                postcode:
                  type: string
                  minimum: 2
                  maximum: 255
                email:
                  type: string
                  minimum: 6
                  maximum: 70
                building_name:
                  type: string
                  minimum: 2
                  maximum: 80
                building_number:
                  type: string
                  maximum: 80
                gender:
                  type: string
                  enum:
                  - Male
                  - Female
                  - Other
                  - Undeclared
                country_code:
                  type: string
                preferred_locale:
                  type: string
              required:
              - forename
              - surname
              - email
              - date_of_birth
              - postcode
      responses:
