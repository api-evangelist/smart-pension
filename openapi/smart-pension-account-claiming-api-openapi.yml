  /account-claiming/attempts:
    post:
      summary: Account-Claiming/Attempt
      tags:
      - Account-Claiming
      parameters: []
      requestBody:
        content:
          application/json:
            examples:
              valid:
                value:
                  first_name: Anthony
                  last_name: Davis
                  date_of_birth: '1986-01-22'
                  national_insurance_number: AA123456B
              invalid_parameters:
                value:
                  first_name: ''
                  last_name: Davis
                  date_of_birth: not a data
                  national_insurance_number: AA12_invalid
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                date_of_birth:
                  type: string
                national_insurance_number:
                  type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                uuid: 019fd1c9-1f5a-7e76-bd1f-21b766ec0f32
                requires_additional_info: false
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                  requires_additional_info:
                    type: boolean
        '422':
          description: Invalid
          content:
            application/json:
              examples:
                invalid_parameters:
                  value:
                    errors:
                    - code: 400003
                      title: First name is required.
                      detail: Enter a first name.
                      meta: {}
                      source:
                        pointer: /data/attributes/first_name
                    - code: 400009
                      title: Date of birth is required.
                      detail: Enter a date of birth.
                      meta: {}
                      source:
                        pointer: /data/attributes/date_of_birth
                    - code: 400012
                      title: National insurance number is invalid.
                      detail: Enter national insurance number in a proper format.
                      meta: {}
                      source:
                        pointer: /data/attributes/national_insurance_number
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        title:
                          type: string
                        detail:
                          type: string
                        meta:
                          type: object
                          properties: {}
                        source:
                          type: object
                          properties:
                            pointer:
                              type: string
components:
  securitySchemes:
    oAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://id.sandbox.autoenrolment.co.uk/oauth/authorize
          tokenUrl: https://id.sandbox.autoenrolment.co.uk/oauth/token
          scopes:
            customer: 'Manage the customer''s company.

              - Create postponements

              - Create and import contributions

              - Edit company details

              - Add and edit employees'
            user: 'Manage all companies linked to the user''s adviser.

              - Manage adviser details

              - Add and edit adviser''s users

              - Create and import contributions for any company managed by the adviser'
            employee: 'Manage the employee account.

              - List employee contributions

              - Edit employee details and preferences'
