  /account-claiming/attempts/{uuid}/password:
    patch:
      summary: Account-Claiming/Attempt/Password
      tags:
      - Account-Claiming
      parameters:
      - name: uuid
        in: path
        required: true
        example: 019fd1c9-18f2-7d37-9aa4-f014ac22b68b
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              valid:
                value:
                  password: 1234Qwertyuiop!
                  password_confirmation: 1234Qwertyuiop!
              invalid_parameters:
                value:
                  password: too_short_invalid
                  password_confirmation: 1234Qwertyuiop!
            schema:
              type: object
              properties:
                password:
                  type: string
                password_confirmation:
                  type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              example: {}
              schema:
                type: object
        '409':
          description: Invalid state
          content:
            application/json:
              examples:
                invalid_state:
                  value:
                    error: Cannot provide password in current state
        '422':
          description: Invalid
          content:
            application/json:
              examples:
                invalid_parameters:
                  value:
                    errors:
                    - code: 404001
                      title: Password is too short.
                      detail: Password is too short.
                      meta: {}
                      source:
                        pointer: /data/attributes/password
                    - code: 404002
                      title: Password is invalid.
                      detail: Password is invalid.
                      meta: {}
                      source:
