openapi: 3.2.0
info:
  title: Keystone Account Claiming API
  version: v12
  description: This is the endpoint description of Keystone API.
servers:
- url: https://api.sandbox.autoenrolment.co.uk
- url: /
tags:
- name: Account-Claiming
paths:
  /account-claiming/confirm-personal-data:
    post:
      summary: Account-Claiming/confirm-personal-data
      tags:
      - Account-Claiming
      security:
      - oAuth2: []
      servers:
      - url: https://account-claiming.sandbox.autoenrolment.co.uk
        description: Account claiming API
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              title: Mr
              first_name: Kendall
              middle_name: null
              last_name: Roy
              phone_number: '+442071234567'
              address_line_1: 10 Downing Street
              address_line_2: Flat 12
              address_line_3: SW1A 2AA
              city: London
              country: GB
              postcode: SW1A 2AA
            schema:
              type: object
              properties:
                title:
                  type:
                  - string
                  - 'null'
                first_name:
                  type:
                  - string
                  - 'null'
                middle_name:
                  type:
                  - string
                  - 'null'
                last_name:
                  type:
                  - string
                  - 'null'
                phone_number:
                  type:
                  - string
                  - 'null'
                address_line_1:
                  type:
                  - string
                  - 'null'
                address_line_2:
                  type:
                  - string
                  - 'null'
                address_line_3:
                  type:
                  - string
                  - 'null'
                city:
                  type:
                  - string
                  - 'null'
                country:
                  type:
                  - string
                  - 'null'
                postcode:
                  type:
                  - string
                  - 'null'
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: 019fd1c8-fa96-745f-8734-ec645fd157ed
                state: succeeded
              schema:
                type: object
                properties:
                  id:
                    type: string
                  state:
                    type: string
        '401':
          description: Unauthorized - incorrect auth header
        '404':
          description: No attempt found
          content:
            application/json:
              example:
                error: Not Found
              schema:
                type: object
                properties:
                  error:
                    type: string
        '409':
          description: Invalid attempt state
          content:
            application/json:
              example:
                error: Attempt KYC must be completed
              schema:
                type: object
                properties:
                  error:
                    type: string
        '422':
          description: Personal data validation error
          content:
            application/json:
              examples:
                cannot_link_accounts:
                  value:
                    id: 019fd1c9-0096-76fd-a1b9-9df2561d3f06
                    state: failed_cannot_link
                    errors: []
                validation_error:
                  value:
                    id: 019fd1c9-0234-7df0-b2e6-9a0f65442f5a
                    state: kyc_completed
                    errors:
                    - code: 400114
                      title: Phone number format is invalid.
                      detail: Phone number is in invalid format.
                      meta: {}
                      source:
                        pointer: /data/attributes/phone_number
              schema:
                type: object
                properties:
                  id:
                    type: string
                  state:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        title:
                          type: string
                        detail:
                          type: string
                        meta:
                          type: object
                          properties: {}
                        source:
                          type: object
                          properties:
                            pointer:
                              type: string
  /account-claiming/current-attempt:
