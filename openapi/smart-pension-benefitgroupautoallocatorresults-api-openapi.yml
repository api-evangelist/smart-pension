components:
  schemas:
    link:
      type: object
      properties:
        rel:
          type: string
        title:
          type: string
        href:
          type: string
    response_benefit_group_auto_allocator_run_result:
      type: object
      properties:
        id:
          type: integer
        employee_id:
          type: integer
        employee_name:
          type:
          - string
          - 'null'
        benefit_group_eligibility_criteria:
          type: object
        eligibility_facts:
          type: object
        previous_benefit_group_id:
          type:
          - integer
          - 'null'
        previous_benefit_group_name:
          type:
          - string
          - 'null'
        current_benefit_group_id:
          type:
          - integer
          - 'null'
        current_benefit_group_name:
          type:
          - string
          - 'null'
        eligible_benefit_groups:
          type: array
          items: {}
        state:
          type: string
        reason_of_failure:
          type:
          - string
          - 'null'
        effective_date:
          type:
          - string
          - 'null'
  securitySchemes:
    oAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://id.sandbox.autoenrolment.co.uk/oauth/authorize
          tokenUrl: https://id.sandbox.autoenrolment.co.uk/oauth/token
          scopes:
            customer: 'Manage the customer''s company.

              - Create postponements

              - Create and import contributions

              - Edit company details

              - Add and edit employees'
            user: 'Manage all companies linked to the user''s adviser.

              - Manage adviser details

              - Add and edit adviser''s users

              - Create and import contributions for any company managed by the adviser'
            employee: 'Manage the employee account.

              - List employee contributions

              - Edit employee details and preferences'
