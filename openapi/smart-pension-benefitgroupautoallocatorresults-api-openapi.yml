openapi: 3.2.0
info:
  title: Keystone Benefit Group Auto Allocator Results API
  version: v12
  description: This is the endpoint description of Keystone API.
servers:
- url: https://api.sandbox.autoenrolment.co.uk
- url: /
tags:
- name: BenefitGroupAutoAllocatorResults
paths:
  /companies/{company_id}/benefit_group_auto_allocator_results/{id}:
    get:
      summary: Companies/BenefitGroupAutoAllocatorResults/Get
      tags:
      - BenefitGroupAutoAllocatorResults
      security:
      - oAuth2:
        - customer
      parameters:
      - name: company_id
        in: path
        required: true
        example: 59
        schema:
          type: string
      - name: id
        in: path
        required: true
        example: 1
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                success:
                  value:
                    id: 1
                    employee_id: 12
                    employee_name: Bursar Jane Alvarez
                    benefit_group_eligibility_criteria: {}
                    eligibility_facts: {}
                    previous_benefit_group_id: null
                    previous_benefit_group_name: null
                    current_benefit_group_id: 2
                    current_benefit_group_name: Group 2
                    eligible_benefit_groups:
                    - 2
                    state: updated
                    reason_of_failure: null
                    effective_date: 05 August, 2026
              schema:
                $ref: '#/components/schemas/response_benefit_group_auto_allocator_run_result'
        '401':
          description: Unauthorized
          content:
            text/plain:
              examples:
                unauthorized:
                  value: 'HTTP Token: Access denied.

                    '
        '404':
          description: Not Found
          content:
            application/json:
              example: ''
  /companies/{company_id}/benefit_group_auto_allocator_results:
    get:
      summary: Companies/BenefitGroupAutoAllocatorResults/List
      tags:
      - BenefitGroupAutoAllocatorResults
      security:
      - oAuth2:
        - customer
      parameters:
      - name: company_id
        in: path
        required: true
        example: 76
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: direction
        in: query
        description: Sort order for the results. Can be "asc" or "desc". Defaults to "asc" if not provided.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Limit for pagination. Defaults to 20 if not provided.
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        description: Offset for pagination. Defaults to 0 if not provided.
        required: false
        schema:
          type: integer
      - name: limit
        in: query
        schema:
          type: integer
        required: false
      - name: offset
        in: query
        schema:
          type: integer
        required: false
      - name: sort
        in: query
        schema:
          type: string
        required: false
      - name: direction
        in: query
        schema:
          type: string
          enum:
          - ASC
          - DESC
        required: false
      - name: filter
        in: query
        schema:
          type: object
          properties:
            employee_id:
              type: array
              items:
                type: integer
            state:
              type: array
              items:
                type: string
            created_at:
              type: array
              items:
                type: string
            employment_period:
              type: object
              properties:
                employee_id:
                  type: integer
        required: false
        style: deepObject
        example: filter%5Beffective_date%5D=2026-06-23
      - name: operator
        in: query
        schema:
          type: string
          enum:
          - or
          - and
        required: false
      responses:
        '200':
          description: Success
          content:
