openapi: 3.2.0
info:
  title: Keystone Postponement API
  version: v12
  description: This is the endpoint description of Keystone API.
servers:
- url: https://api.sandbox.autoenrolment.co.uk
- url: /
tags:
- name: Postponement
paths:
  /companies/{company_id}/employees/{employee_id}/postponements:
    post:
      summary: Postponement/Create
      tags:
      - Postponement
      security:
      - oAuth2:
        - user
        - customer
      parameters:
      - name: company_id
        in: path
        required: true
        example: 807
        schema:
          type: string
      - name: employee_id
        in: path
        required: true
        example: 422
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              success:
                value:
                  deferral_on: '2026-08-06'
              invalid_parameters:
                value:
                  deferral_on: ''
            schema:
              type: object
              properties:
                include:
                  type: array
                  items:
                    enum:
                    - employee
      responses:
        '201':
          description: Creates a postponement
          content:
            application/json:
              example:
                id: 3
                employee_id: 422
                starts_on: '2026-08-05'
                ends_on: '2026-08-05'
                created_at: '2026-08-05T13:01:46.000+01:00'
                updated_at: '2026-08-05T13:01:46.000+01:00'
                deferral_on: '2026-08-06'
                cancelled_at: null
                links:
                - rel: employee
                  title: employee
                  href: https://api.host.com/companies/807/employees/422
              schema:
                $ref: '#/components/schemas/response_postponement'
        '422':
          description: Invalid parameters
          content:
            application/json:
              example:
                errors:
                - code: 1401
                  title: The deferral date is a required field.
                  detail: You need to select a deferral date for the postponement. This can be any date up to 3 months and a day later than either your staging date or the employees start of employment, which ever is the latest.
                  meta: {}
                  source:
                    pointer: /data/attributes/deferral_on
    get:
      summary: Postponement/List
      tags:
      - Postponement
      security:
      - oAuth2:
        - user
        - customer
      parameters:
      - name: company_id
        in: path
        required: true
        example: 819
        schema:
          type: string
      - name: employee_id
        in: path
        required: true
        example: 429
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                limit: 50
                offset: 0
                total: 0
                links:
                - rel: self
                  title: self
                  href: http://api.host.com/companies/819/employees/429/postponements
                - rel: first
                  title: first
                  href: http://api.host.com/companies/819/employees/429/postponements?offset=0&limit=50
                - rel: last
                  title: last
                  href: http://api.host.com/companies/819/employees/429/postponements?offset=0&limit=50
                postponements: []
              schema:
                type: object
                properties:
                  limit:
                    type:
                    - integer
                    - 'null'
                  offset:
                    type:
                    - integer
                    - 'null'
                  total:
                    type:
                    - integer
                    - 'null'
                  links:
                    type: array
                    items:
                      $ref: '#/components/schemas/link'
                  postponements:
                    type:
                    - array
                    - 'null'
                    items:
                      $ref: '#/components/schemas/response_postponement'
  /companies/{company_id}/employees/{employee_id}/postponements/{id}:
    delete:
      summary: Postponement/Destroy
      tags:
      - Postponement
      security:
      - oAuth2:
        - user
        - customer
      parameters:
      - name: id
        in: path
        required: true
        example: 4
        schema:
          type: string
      - name: company_id
        in: path
        required: true
        example: 809
        schema:
          type: string
      - name: employee_id
        in: path
        required: true
        example: 424
        schema:
          type: string
      responses:
        '204':
          description: Success
        '403':
          description: Forbidden when the employee already has a contribution
        '404':
          description: Not Found
    get:
      summary: Postponement/Get
      tags:
      - Postponement
      security:
      - oAuth2:
        - user
        - customer
      parameters:
      - name: id
        in: path
        required: true
        example: 7
        schema:
          type: string
      - name: company_id
        in: path
        required: true
        example: 815
        schema:
          type: string
      - name: employee_id
        in: path
        required: true
        example: 427
        schema:
          type: string
      - name: include[]
        in: query
        schema:
          type: array
          items:
            enum:
            - employee
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                id: 7
                employee_id: 427
                starts_on: '2026-08-05'
                ends_on: '2026-08-05'
                created_at: '2026-08-05T13:01:48.000+01:00'
