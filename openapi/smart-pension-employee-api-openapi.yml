                  type: string
                  minimum: 2
                  maximum: 65
                postcode:
                  type: string
                  minimum: 2
                  maximum: 255
                employment_category:
                  type: string
                contractual_enrolment:
                  type: boolean
                target_retirement_age:
                  type: integer
                line3:
                  type: string
