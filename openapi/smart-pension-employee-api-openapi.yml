                  type: number
                maximum_company_percentage:
                  type: number
                minimum_roth_percentage:
                  type: number
                maximum_roth_percentage:
                  type: number
              required:
              - forename
              - surname
              - gender
              - date_of_birth
              - starts_on
              - postcode
