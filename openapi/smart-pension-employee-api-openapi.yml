openapi: 3.2.0
info:
  title: Keystone Employee API
  version: v12
  description: This is the endpoint description of Keystone API.
servers:
- url: https://api.sandbox.autoenrolment.co.uk
- url: /
tags:
- name: Employee
paths:
  /companies/{company_id}/employees/{employee_id}/active_payroll_configuration:
    get:
      summary: ActivePayrollConfiguration/Get
      tags:
      - Employee
      parameters:
      - name: company_id
        in: path
        required: true
        example: 240
        schema:
          type: string
      - name: employee_id
        in: path
        required: true
        example: 57
        schema:
          type: string
      security:
      - oAuth2:
        - user
        - customer
      responses:
        '200':
          description: Success - when the employee has an active payroll configuration
          content:
            application/json:
              example:
                id: 1
                company_id: 241
                description: eget eleifend
                frequency: weekly
                name: morbi porttitor1
                salary_rate: annual
                created_at: '2026-08-05T12:59:05.000+01:00'
                updated_at: '2026-08-05T12:59:05.000+01:00'
                uuid: 1fb28d64-444d-48a0-8baf-8cf9c462c8ec
                links:
                - rel: company
                  title: company
                  href: https://api.host.com/companies/241
                frequency_editable: false
                destroyable: false
              schema:
                $ref: '#/components/schemas/response_payroll_configuration'
        '404':
          description: Not Found - when the employee does not have an active payroll configuration
          content:
            application/json:
              example: ''
  /companies/{company_id}/employees:
    post:
      summary: Employees/Create
      tags:
      - Employee
      security:
      - oAuth2:
        - user
        - customer
      parameters:
      - name: company_id
        in: path
        required: true
        example: 564
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              valid_request:
                value:
                  forename: forename
                  surname: surname
                  postcode: w6 4ra
                  gender: Male
                  date_of_birth: '1985-05-05'
                  starts_on: '2016-01-01'
                  payroll_name: payroll_name
              invalid_parameter:
                value:
                  forename: ''
                  surname: ''
                  postcode: ''
                  gender: ''
            schema:
              type: object
              properties:
                date_of_birth:
                  type: string
                starts_on:
                  type: string
                ends_on:
                  type: string
                title:
                  type: string
