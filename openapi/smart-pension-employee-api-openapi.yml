                  type: string
                national_insurance_number:
                  type: string
                exit_reason:
                  type: string
                opt_state:
                  type: string
                  enum:
                  - ignition
                  - opted_in
                  - opted_out
                  - rejoined
                  - ceased_membership
                event_date:
                  type: string
                event_code:
                  type: string
                gender:
                  type: string
                  enum:
                  - Male
                  - Female
                percentage:
                  type: number
                company_percentage:
                  type: number
                company_match:
                  type: boolean
                group_id:
                  type: integer
                works_in_uk:
                  type: boolean
                contribute_if_entitled:
                  type: boolean
                customer_id:
                  type: integer
                retirement_age:
