                    - integer
                    - 'null'
                  links:
                    type: array
                    items:
                      $ref: '#/components/schemas/link'
                  subaccounts:
                    type:
                    - array
                    - 'null'
                    items:
                      $ref: '#/components/schemas/response_investment_account'
              example:
                limit: 50
