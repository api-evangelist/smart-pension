openapi: 3.2.0
info:
  title: Keystone Subaccounts API
  version: v12
  description: This is the endpoint description of Keystone API.
servers:
- url: https://api.sandbox.autoenrolment.co.uk
- url: /
tags:
- name: Subaccounts
paths:
  /companies/{company_id}/employees/{employee_id}/subaccounts/{uuid}/default_fund_splits:
    get:
      summary: Companies/Employees/Subaccounts/DefaultFundSplits
      tags:
      - Subaccounts
      security:
      - oAuth2:
        - employee
      parameters:
      - name: company_id
        in: path
        required: true
        example: 863
        schema:
          type: string
      - name: employee_id
        in: path
        required: true
        example: 462
        schema:
          type: string
      - name: uuid
        in: path
        required: true
        example: c1c19ed3-ca0e-4d3f-b209-2890fd513f32
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                success:
                  value:
                    fund_splits:
                    - fund:
                        id: 137
                        name: Fund-137
                        display_name: base display name
                        description: base description
                        fact_sheet_url: https://www.fund.com
                        fund_provider: FundProvider 137
                      percentage: 100
              schema:
                $ref: '#/components/schemas/response_subaccount_default_fund_splits'
              example:
                fund_splits: []
        '401':
          description: Unauthorized
        '404':
          description: Not Found
  /companies/{company_id}/employees/{employee_id}/subaccounts/{uuid}:
    get:
      summary: Companies/Employees/Subaccounts/Get
      tags:
      - Subaccounts
      security:
      - oAuth2:
        - employee
      parameters:
      - name: company_id
        in: path
        required: true
        example: 867
        schema:
          type: string
      - name: employee_id
        in: path
        required: true
        example: 465
        schema:
          type: string
      - name: uuid
        in: path
        required: true
        example: 62e32c44-a825-4889-8813-df98de3c9c2b
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                success:
                  value:
                    id: 511
                    uuid: 62e32c44-a825-4889-8813-df98de3c9c2b
                    name: Kxj669plnQ
                    scheme_id: 1213
                    subaccount_group: Uncrystallised
                    frontend_tag: null
                    active_from: '2026-08-05T13:02:03.775+01:00'
                    active_until: null
                    investments_locked: false
                    redirect_allowed: true
                    created_at: '2026-08-05T13:02:03.775+01:00'
                    updated_at: '2026-08-05T13:02:03.775+01:00'
                    valuation: 300
                    valuation_available_for_disinvestment: 270
                    active_for_employee: true
                    pending_switch_to_subaccount_uuid: 7d142048-7760-47dc-a9fe-eb9bbaf9967b
                    money_movement_locked: true
                    projection_age: null
                    projection_amount: null
                    projection_amount_currency: null
              schema:
                $ref: '#/components/schemas/response_investment_account'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
  /companies/{company_id}/employees/{employee_id}/subaccounts:
    get:
      summary: Companies/Employees/Subaccounts
      tags:
      - Subaccounts
      security:
      - oAuth2:
        - employee
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
        required: false
      - name: offset
        in: query
        schema:
          type: integer
        required: false
      - name: sort
        in: query
        schema:
          type: string
        required: false
      - name: direction
        in: query
        schema:
          type: string
          enum:
          - ASC
          - DESC
        required: false
      - name: filter
        in: query
        schema:
          type: object
          properties:
            subaccount_group:
              type: array
              items:
                type: string
            frontend_tag:
              type: array
              items:
                type: string
        required: false
        style: deepObject
        example: filter%5Bfrontend_tag%5D=yxz
      - name: operator
        in: query
        schema:
          type: string
          enum:
          - or
          - and
        required: false
      - name: company_id
        in: path
        required: true
        example: 884
        schema:
          type: string
      - name: employee_id
        in: path
        required: true
        example: 473
        schema:
          type: string
      - name: X-Account-Id
        in: header
        description: Account ID, provided when authenticating with profile JWT token
        required: false
        schema:
          type: string
        example: '471'
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                With valid params without filtering:
                  value:
                    limit: 50
                    offset: 0
                    total: 3
                    links:
                    - rel: self
                      title: self
                      href: http://api.host.com/companies/880/employees/471/subaccounts
                    - rel: first
                      title: first
                      href: http://api.host.com/companies/880/employees/471/subaccounts?offset=0&limit=50
                    - rel: last
                      title: last
                      href: http://api.host.com/companies/880/employees/471/subaccounts?offset=0&limit=50
                    subaccounts:
                    - id: 531
