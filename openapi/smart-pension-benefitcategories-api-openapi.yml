openapi: 3.2.0
info:
  title: Keystone Benefit Categories API
  version: v12
  description: This is the endpoint description of Keystone API.
servers:
- url: https://api.sandbox.autoenrolment.co.uk
- url: /
tags:
- name: BenefitCategories
paths:
  /companies/{company_id}/employees/{employee_id}/benefit_categories/{benefit_rule_set_id}:
    get:
      summary: BenefitCategories/Get
      tags:
      - BenefitCategories
      parameters:
      - name: company_id
        in: path
        required: true
        example: 318
        schema:
          type: string
      - name: employee_id
        in: path
        required: true
        example: 104
        schema:
          type: string
      - name: benefit_rule_set_id
        in: path
        required: true
        example: 5
        schema:
          type: string
      security:
      - oAuth2:
        - employee
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                success_pcls_with_default_subaccount_splits:
