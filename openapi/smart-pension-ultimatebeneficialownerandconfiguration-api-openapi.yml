                        type: string
                      surname:
                        type: string
                      gender:
                        type: string
                      date_of_birth:
                        type: string
                      nationality:
                        type: string
                      type:
                        type: string
                      entity_name:
                        type: string
                      country_of_jurisdiction:
                        type: string
                      registered_address:
