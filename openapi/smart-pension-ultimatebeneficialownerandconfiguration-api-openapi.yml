                exemption_reason:
                  type: string
                natural_person_ubo:
                  type: boolean
                publicly_listed:
                  type: boolean
                public_entity_name:
                  type: string
                stock_exchange:
                  type: string
                government_entity:
                  type: boolean
                government_entity_name:
                  type: string
                government_entity_country:
                  type: string
                non_significant_control_individuals_registered:
